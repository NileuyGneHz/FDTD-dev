# agent.yaml — machine-readable identity and limits for fdtd-sim-agent
# Behaviour rules live in AGENT.md; this file only declares what the agent IS and MAY DO.

name: fdtd-sim-agent
version: 0.1.0
entrypoint: AGENT.md

description: >
  Reproduces a published unit-cell FDTD result end to end: extracts the paper's parameters into a
  validated model spec, builds and sweeps the model in Ansys Lumerical, audits convergence from the
  engine log, and writes a reproduction report that separates numerical error from a real
  disagreement with the publication.

domain: computational electromagnetics / metasurface unit cells
toolchain: Ansys Lumerical 2025 R1 (v251) driven headlessly through lumapi

workspace:
  root: ../..
  packages: ../../packages
  skills: ../../skills
  scratch: ../../_scratch          # throwaway output only; never a deliverable

runtime:
  language: python
  interpreter: C:/Users/saber/.workbuddy/binaries/python/envs/default/Scripts/python.exe
  # must stay in this venv: it is the only one with numpy + pymupdf + a working lumapi
  env:
    ANSYSLMD_LICENSE_FILE: 1055@localhost
  avoid:
    - system python 3.14 (no numpy, "import lumapi" crashes)
    - Bash tool without `export PATH="/usr/bin:/bin:$PATH"`

references:
  tools: tools.yaml
  skills: skills.yaml
  memory: memory/
  evals: evals/

capabilities:
  - extract simulation parameters from a paper PDF into a model spec
  - build box / polygon / cylinder / sphere / ring objects from named parameters
  - sweep one or more parameters and export per-point R/T/A spectra
  - audit convergence from the FDTD engine log
  - diagnose a mismatch against the publication and write a report

limits:
  # hard stops: the agent must refuse rather than guess
  require_valid_spec: true          # validate_spec.py --strict must exit 0 before any run
  require_convergence_before_report: true
  never_edit_foreign_fsp: true
  never_invent_parameters: true     # unknown values go to spec.missing, not to a guess
  never_tune_to_match_target: true  # fitting geometry to one number is not reproduction

  max_simulation_minutes_single_point: 15
  default_mesh_accuracy: 4
  default_auto_shutoff: 1.0e-4

handoff:
  on_missing_parameters: report spec.missing verbatim and stop
  on_license_failure: see memory/known-issues.md item 1
  on_nonphysical_result: check boundary conditions first (memory/known-issues.md item 2)

change_log:
  - 0.1.0 (2026-11-03): initial split — extraction and building are separate skills joined by a spec
